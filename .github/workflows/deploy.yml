# .github/workflows/deploy.yml
name: Validate and Publish Frontend

on:
  pull_request:
    paths:
      - 'apps/front-end/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.localerc.json'
      - '.npmrc'
      - 'Dockerfile.front'
      - '.github/workflows/deploy.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/front-end/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.localerc.json'
      - '.npmrc'
      - 'Dockerfile.front'
      - '.github/workflows/deploy.yml'

env:
  REGISTRY: ghcr.io

jobs:
  validate:
    name: Test and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate production locale bundles
        run: pnpm locale make flow --prod

      - name: Run unit tests
        run: pnpm --filter @fuyeor/flow-front-end test

      - name: Build frontend
        run: pnpm --filter @fuyeor/flow-front-end build

  publish:
    name: Build and push GHCR image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.front
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
